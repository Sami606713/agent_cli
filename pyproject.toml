[project]
name = "langctl"
# Single-sourced from src/langctl/__init__.py so the package and `--version`
# can never disagree.
dynamic = ["version"]
description = "Scaffold, run, and deploy production LangChain agents — frontend and agent in one command."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "langctl contributors" }]
keywords = [
    "langchain",
    "langgraph",
    "langsmith",
    "agents",
    "llm",
    "cli",
    "scaffold",
    "nextjs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Sami606713/agent_cli"
Repository = "https://github.com/Sami606713/agent_cli"
Issues = "https://github.com/Sami606713/agent_cli/issues"
Changelog = "https://github.com/Sami606713/agent_cli/blob/main/CHANGELOG.md"

[project.scripts]
langctl = "langctl.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/langctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langctl"]

[tool.hatch.build.targets.sdist]
# Ship the tests and plan with the sdist so the package is reproducible from it.
include = ["src", "tests", "plan", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in a default is the framework's idiom, not a mutable default.
"src/langctl/commands/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
